<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OrçaFácil</title>
<style>
:root{color-scheme:light dark;--fundo:#fff;--texto:#1b1f23;--suave:#57606a;--linha:#d0d7de;--destaque:#1f4e79;--cartao:#f6f8fa}
@media (prefers-color-scheme:dark){:root{--fundo:#0e1930;--texto:#e6ecfa;--suave:#a8b6d2;--linha:#25355a;--destaque:#8fc1ff;--cartao:#132039}}
*{box-sizing:border-box}
body{margin:0;background:var(--fundo);color:var(--texto);font:17px/1.65 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:46rem;margin:0 auto;padding:1.5rem 1.25rem 3rem}
header.topo{border-bottom:1px solid var(--linha);background:var(--cartao)}
header.topo div{max-width:46rem;margin:0 auto;padding:.9rem 1.25rem;font-weight:700}
header.topo a{color:var(--destaque);text-decoration:none}
h1{font-size:1.75rem;line-height:1.25;margin:1rem 0 .5rem}
h2{font-size:1.25rem;margin:2rem 0 .5rem;color:var(--destaque)}
p,li{margin:.5rem 0}
ol,ul{padding-left:1.4rem}
a{color:var(--destaque)}
code{background:var(--cartao);border:1px solid var(--linha);border-radius:4px;padding:.05rem .35rem;font-size:.92em}
.versao{color:var(--suave);font-size:.9rem;margin-top:0}
.cartoes{display:grid;gap:.75rem;margin-top:1.25rem}
.cartoes a{display:block;padding:1rem 1.1rem;border:1px solid var(--linha);border-radius:10px;background:var(--cartao);text-decoration:none;color:var(--texto)}
.cartoes a strong{display:block;color:var(--destaque)}
footer{border-top:1px solid var(--linha);color:var(--suave);font-size:.9rem;margin-top:2.5rem;padding-top:1rem}
</style>
</head>
<body>
<header class="topo"><div>OrçaFácil</div></header>
<main>
<h1>OrçaFácil</h1>
<p>Orçamentos de obra em PDF, prontos para o WhatsApp. Para Windows.</p>
<div class="cartoes">
<a href="instalar.html"><strong>Como instalar o OrçaFácil</strong></a>
<a href="termos.html"><strong>Termos de Uso do OrçaFácil</strong></a>
<a href="privacidade.html"><strong>Política de Privacidade do OrçaFácil</strong></a>
</div>

<footer>OrçaFácil · Elevare Systems<br>WhatsApp +55 (47) 98489-8598 · elevare36@gmail.com</footer>
</main>
</body>
</html>
